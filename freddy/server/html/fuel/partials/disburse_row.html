<tr id="disburse-{{ d.pk }}" class="hover:bg-blue-900/10 transition">
  <td class="px-4 py-3 font-mono text-xs text-blue-400">{{ d.reference }}</td>
  <td class="px-4 py-3 font-medium text-white">{{ d.church.name }}</td>
  <td class="px-4 py-3 text-gray-300">{{ d.church.station.name }}</td>
  <td class="px-4 py-3 text-xs" style="color:var(--muted);">{{ d.period_start|date:"M d" }} – {{ d.period_end|date:"M d, Y" }}</td>
  <td class="px-4 py-3 text-right text-green-400 font-semibold">${{ d.amount_usd }}</td>
  <td class="px-4 py-3 text-xs" style="color:var(--muted);">{{ d.payment_method|default:"—" }}</td>
  <td class="px-4 py-3 text-xs" style="color:var(--muted);">{{ d.prepared_by.username|default:"—" }}</td>
  <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-xs font-medium status-{{ d.status }}">{{ d.get_status_display }}</span></td>
  <td class="px-4 py-3 text-xs"><a href="{% url 'fuel:disbursement-edit' d.pk %}" class="text-gray-400 hover:text-white">Edit</a></td>
</tr>
