<!-- templates/staff.html -->
{% block content %}
<div class="space-y-6">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-white">
      Members
    </h1>

    <a
      href="#"
      hx-target="#main"
      hx-swap="innerHTML"
      hx-get="/staff/create"
      class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition"
    >
      Add Member
    </a>
  </div>

  <!-- Table -->
  <div class="bg-gray-900 rounded-xl shadow overflow-hidden border border-gray-700">

    <table class="w-full text-gray-200">

      <!-- Table Header -->
      <thead class="bg-gray-800 text-gray-300">
        <tr>
          <th class="p-4 text-left">Photo</th>
          <th class="p-4 text-left">Name</th>
          <th class="p-4 text-left">Role</th>
          <th class="p-4 text-left">Email</th>
          <th class="p-4 text-left">Actions</th>
        </tr>
      </thead>

      <!-- Table Body -->
      <tbody>

        <!-- Row -->
        <tr class="border-t border-gray-700 hover:bg-gray-800 transition">

          <td class="p-4">
            <img
              src="https://i.pravatar.cc/40?img=1"
              class="w-10 h-10 rounded-full border border-gray-600"
            >
          </td>

          <td class="p-4 font-medium">
            Alice Johnson
          </td>

          <td class="p-4 text-gray-400">
            Manager
          </td>

          <td class="p-4 text-gray-400">
            alice@kdcharite.com
          </td>

          <td class="p-4 flex gap-3">

            <a
              href="#"
              hx-target="#main"
              hx-swap="innerHTML"
              hx-get="/staff/1"
              class="text-blue-400 hover:text-blue-300"
            >
              View
            </a>

            <a
              href="#"
              hx-target="#main"
              hx-swap="innerHTML"
              hx-get="/staff/1/edit"
              class="text-yellow-400 hover:text-yellow-300"
            >
              Edit
            </a>

            <button
              class="text-red-400 hover:text-red-300"
            >
              Delete
            </button>

          </td>

        </tr>

        <!-- Row -->
        <tr class="border-t border-gray-700 hover:bg-gray-800 transition">

          <td class="p-4">
            <img
              src="https://i.pravatar.cc/40?img=2"
              class="w-10 h-10 rounded-full border border-gray-600"
            >
          </td>

          <td class="p-4 font-medium">
            David Smith
          </td>

          <td class="p-4 text-gray-400">
            Sales
          </td>

          <td class="p-4 text-gray-400">
            david@kdcharite.com
          </td>

          <td class="p-4 flex gap-3">

            <a
              href="#"
              hx-target="#main"
              hx-swap="innerHTML"
              hx-get="/staff/2"
              class="text-blue-400 hover:text-blue-300"
            >
              View
            </a>

            <a
              href="#"
              hx-target="#main"
              hx-swap="innerHTML"
              hx-get="/staff/2/edit"
              class="text-yellow-400 hover:text-yellow-300"
            >
              Edit
            </a>

            <button
              class="text-red-400 hover:text-red-300"
            >
              Delete
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
{% endblock %}
