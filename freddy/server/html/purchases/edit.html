{% block content %}
<div class="max-w-2xl mx-auto bg-gray-900 border border-gray-800 p-6 rounded-xl shadow-lg">

  <h1 class="text-2xl font-bold text-white mb-6">
    Edit Purchase
  </h1>

  <form class="space-y-4">

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-2">
        Customer Name
      </label>

      <input
        type="text"
        value="John Doe"
        class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
      >
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-2">
        Amount
      </label>

      <input
        type="number"
        value="200"
        class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
      >
    </div>

    <div class="pt-2">
      <button
        class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-semibold px-6 py-3 rounded-lg transition"
      >
        Update Purchase
      </button>
    </div>

  </form>

</div>
{% endblock %}
