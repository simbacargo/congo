{% block content %}
<div class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">

    <div>
      <h1 class="text-2xl font-bold text-white">
        sales
      </h1>

      <p class="text-gray-400 text-sm mt-1">
        Manage customer sales and transactions
      </p>
    </div>

    <a
      href="#"
      hx-target="#main"
      hx-swap="innerHTML"
      hx-get="/sales/create"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition shadow"
    >
      + Add Purchase
    </a>

  </div>

  <!-- Table Container -->
  <div class="bg-gray-900 border border-gray-700 rounded-2xl shadow-lg overflow-hidden">

    <!-- Table -->
    <table class="w-full text-gray-200">

      <!-- Header -->
      <thead class="bg-gray-800 text-gray-300">
        <tr>
          <th class="p-4 text-left font-semibold">Order</th>
          <th class="p-4 text-left font-semibold">Customer</th>
          <th class="p-4 text-left font-semibold">Amount</th>
          <th class="p-4 text-left font-semibold">Status</th>
          <th class="p-4 text-left font-semibold">Actions</th>
        </tr>
      </thead>

      <!-- Body -->
      <tbody>

        <!-- Row -->
        <tr class="border-t border-gray-700 hover:bg-gray-800 transition">

          <td class="p-4 font-medium text-white">
            #1001
          </td>

          <td class="p-4">
            <div class="flex items-center gap-3">

              <img
                src="https://i.pravatar.cc/40?img=3"
                class="w-10 h-10 rounded-full border border-gray-700"
              >

              <div>
                <p class="font-medium text-white">
                  John Doe
                </p>

                <p class="text-sm text-gray-400">
                  john@kdcharite.com
                </p>
              </div>

            </div>
          </td>

          <td class="p-4 font-semibold text-green-400">
            $200
          </td>

          <td class="p-4">
            <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm">
              Completed
            </span>
          </td>

          <td class="p-4">

            <div class="flex gap-3">

              <a
                href="#"
                hx-target="#main"
                hx-swap="innerHTML"
                hx-get="/sales/1"
                class="text-blue-400 hover:text-blue-300 transition"
              >
                View
              </a>

              <a
                href="#"
                hx-target="#main"
                hx-swap="innerHTML"
                hx-get="/sales/1/edit"
                class="text-yellow-400 hover:text-yellow-300 transition"
              >
                Edit
              </a>

              <button
                class="text-red-400 hover:text-red-300 transition"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

        <!-- Row -->
        <tr class="border-t border-gray-700 hover:bg-gray-800 transition">

          <td class="p-4 font-medium text-white">
            #1002
          </td>

          <td class="p-4">
            <div class="flex items-center gap-3">

              <img
                src="https://i.pravatar.cc/40?img=5"
                class="w-10 h-10 rounded-full border border-gray-700"
              >

              <div>
                <p class="font-medium text-white">
                  Jane Smith
                </p>

                <p class="text-sm text-gray-400">
                  jane@kdcharite.com
                </p>
              </div>

            </div>
          </td>

          <td class="p-4 font-semibold text-green-400">
            $450
          </td>

          <td class="p-4">
            <span class="bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-full text-sm">
              Pending
            </span>
          </td>

          <td class="p-4">

            <div class="flex gap-3">

              <a
                href="#"
                hx-target="#main"
                hx-swap="innerHTML"
                hx-get="/sales/2"
                class="text-blue-400 hover:text-blue-300 transition"
              >
                View
              </a>

              <a
                href="#"
                hx-target="#main"
                hx-swap="innerHTML"
                hx-get="/sales/2/edit"
                class="text-yellow-400 hover:text-yellow-300 transition"
              >
                Edit
              </a>

              <button
                class="text-red-400 hover:text-red-300 transition"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
{% endblock %}
