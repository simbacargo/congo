<header class="w-full bg-gray-950 border-b border-gray-800 text-gray-100 px-4 py-3 flex items-center justify-between relative overflow-visible">

  <!-- LEFT -->
  <button class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm transition">
    + New
  </button>

  <!-- CENTER SEARCH -->
  <div class="flex-1 max-w-xl mx-6">
    <input
      id="searchInput"
      type="text"
      placeholder="Search..."
      class="w-full bg-gray-900 border border-gray-800 rounded-lg py-2 px-3 text-sm focus:ring focus:ring-blue-500 outline-none"
    />
  </div>

  <!-- RIGHT CONTROLS -->
  <div class="flex items-center gap-3 relative">

    <!-- LANGUAGE -->
    <div class="relative">
      <button onclick="toggleMenu('langMenu')" class="icon-btn">🌐</button>

      <div id="langMenu" class="dropdown right-0 hidden">
        <div class="dropdown-item" onclick="setLang('en')">English</div>
        <div class="dropdown-item" onclick="setLang('fr')">French</div>
		<div class="dropdown-item" onclick="setLang('sw')">Swahili</div>
      </div>
    </div>

    <!-- NOTIFICATIONS -->
    <div class="relative">
      <button onclick="toggleMenu('notifMenu')" class="icon-btn">
        🔔
        <span class="badge">3</span>
      </button>

      <div id="notifMenu" class="dropdown right-0 hidden">
        <p class="dropdown-title">Notifications</p>

        <div class="space-y-2">
          <div class="dropdown-item">New order received</div>
          <div class="dropdown-item">User signed up</div>
          <div class="dropdown-item">Backup completed</div>
        </div>
      </div>
    </div>

    <!-- USER -->
    <div class="relative">
      <button onclick="toggleMenu('userMenu')" class="flex items-center gap-2">
        <img
          src="https://i.pravatar.cc/40"
          class="w-8 h-8 rounded-full border border-gray-700"
        />
      </button>

      <div id="userMenu" class="dropdown right-0 hidden">
        <div class="dropdown-item font-semibold border-b border-gray-800">
          {{user}}
          <p class="text-xs text-gray-400">{{user}}@kdcharite.com</p>
        </div>

        <div class="dropdown-item">Profile</div>
        <div class="dropdown-item">Settings</div>
        <div class="dropdown-item text-red-400">Logout</div>
      </div>
    </div>

  </div>

  <!-- OVERLAY -->
  <div id="overlay" class="fixed inset-0 z-40 hidden" onclick="closeAll()"></div>

</header>

<style>
  .icon-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 0.5rem;
    position: relative;
    cursor: pointer;
  }

  .icon-btn:hover {
    background: #1f2937;
  }

  .dropdown {
    position: absolute;
    top: 100%;
    margin-top: 8px;
    width: 16rem;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 0.75rem;
    box-shadow: 0 10px 15px rgba(0,0,0,0.3);
    padding: 0.75rem;
    z-index: 50;
  }

  .dropdown-title {
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .dropdown-item {
    padding: 0.5rem;
    font-size: 0.875rem;
    border-radius: 0.5rem;
    cursor: pointer;
  }

  .dropdown-item:hover {
    background: #1f2937;
  }

  .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #ef4444;
    font-size: 10px;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
  }

  .hidden {
    display: none;
  }
</style>

<script>
  function closeAll() {
    document.querySelectorAll('.dropdown').forEach(el => el.classList.add('hidden'));
    document.getElementById('overlay').classList.add('hidden');
  }

  function toggleMenu(id) {
    const menu = document.getElementById(id);
    const isHidden = menu.classList.contains('hidden');

    closeAll();

    if (isHidden) {
      menu.classList.remove('hidden');
      document.getElementById('overlay').classList.remove('hidden');
    }
  }

  function setLang(lang) {
    console.log('Language set to:', lang);
    closeAll();
  }
</script>
