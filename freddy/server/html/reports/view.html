{% block content %}
<div class="space-y-6">

  <!-- Header -->
  <div class="flex justify-between items-center">

    <div>
      <h1 class="text-3xl font-bold text-white">
        Monthly Revenue Report
      </h1>

      <p class="text-gray-400 mt-1">
        Financial report for May 2026
      </p>
    </div>

    <div class="flex gap-3">

      <a
        href="#"
        hx-target="#main"
        hx-swap="innerHTML"
        hx-get="/reports/1/edit"
        class="bg-yellow-500 hover:bg-yellow-600 text-black px-4 py-2 rounded-lg transition"
      >
        Edit Report
      </a>

      <button
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition"
      >
        Download PDF
      </button>

    </div>

  </div>

  <!-- Metrics -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5">
      <p class="text-gray-400 text-sm">
        Revenue
      </p>

      <h2 class="text-3xl font-bold text-green-400 mt-2">
        $24,500
      </h2>
    </div>

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5">
      <p class="text-gray-400 text-sm">
        Orders
      </p>

      <h2 class="text-3xl font-bold text-blue-400 mt-2">
        1,240
      </h2>
    </div>

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5">
      <p class="text-gray-400 text-sm">
        Profit
      </p>

      <h2 class="text-3xl font-bold text-yellow-400 mt-2">
        $17,600
      </h2>
    </div>

  </div>

  <!-- Chart -->
  <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 shadow">

    <div class="flex justify-between items-center mb-6">

      <div>
        <h2 class="text-xl font-semibold text-white">
          Revenue Trend
        </h2>

        <p class="text-gray-400 text-sm mt-1">
          Last 6 months performance
        </p>
      </div>

    </div>

    <canvas id="reportChart" height="100"></canvas>

  </div>

</div>

<script>
new Chart(document.getElementById("reportChart"), {
  type: 'line',
  data: {
    labels: ['Jan','Feb','Mar','Apr','May','Jun'],
    datasets: [{
      label: 'Revenue',
      data: [1200, 1900, 3000, 2400, 4200, 5000],
      borderColor: '#3b82f6',
      backgroundColor: 'rgba(59,130,246,0.2)',
      tension: 0.4,
      fill: true
    }]
  },
  options: {
    plugins: {
      legend: {
        labels: {
          color: '#d1d5db'
        }
      }
    },
    scales: {
      x: {
        ticks: {
          color: '#9ca3af'
        },
        grid: {
          color: '#374151'
        }
      },
      y: {
        ticks: {
          color: '#9ca3af'
        },
        grid: {
          color: '#374151'
        }
      }
    }
  }
});
</script>
{% endblock %}
