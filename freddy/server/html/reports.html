{% block content %}
<div class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">

    <div>
      <h1 class="text-2xl font-bold text-white">
        Reports
      </h1>

      <p class="text-gray-400 text-sm mt-1">
        Business analytics and financial insights
      </p>
    </div>

    <div class="flex gap-3">

      <a
        href="#"
        hx-target="#main"
        hx-swap="innerHTML"
        hx-get="/reports/create"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition shadow"
      >
        + Create Report
      </a>

      <button
        class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-lg border border-gray-700 transition"
      >
        Export
      </button>

    </div>

  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5 shadow">
      <p class="text-gray-400 text-sm">
        Revenue
      </p>

      <h2 class="text-3xl font-bold text-white mt-2">
        $24,500
      </h2>

      <p class="text-green-400 text-sm mt-2">
        +12.4%
      </p>
    </div>

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5 shadow">
      <p class="text-gray-400 text-sm">
        Orders
      </p>

      <h2 class="text-3xl font-bold text-white mt-2">
        1,240
      </h2>

      <p class="text-blue-400 text-sm mt-2">
        +8.1%
      </p>
    </div>

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5 shadow">
      <p class="text-gray-400 text-sm">
        Customers
      </p>

      <h2 class="text-3xl font-bold text-white mt-2">
        842
      </h2>

      <p class="text-yellow-400 text-sm mt-2">
        +3.2%
      </p>
    </div>

    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5 shadow">
      <p class="text-gray-400 text-sm">
        Expenses
      </p>

      <h2 class="text-3xl font-bold text-white mt-2">
        $6,900
      </h2>

      <p class="text-red-400 text-sm mt-2">
        +1.5%
      </p>
    </div>

  </div>

  <!-- Reports Table -->
  <div class="bg-gray-900 border border-gray-700 rounded-2xl shadow overflow-hidden">

    <table class="w-full text-gray-200">

      <thead class="bg-gray-800 text-gray-300">
        <tr>
          <th class="p-4 text-left">Report</th>
          <th class="p-4 text-left">Type</th>
          <th class="p-4 text-left">Created</th>
          <th class="p-4 text-left">Status</th>
          <th class="p-4 text-left">Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr class="border-t border-gray-700 hover:bg-gray-800 transition">

          <td class="p-4">
            Monthly Revenue Report
          </td>

          <td class="p-4 text-gray-400">
            Financial
          </td>

          <td class="p-4 text-gray-400">
            2026-05-08
          </td>

          <td class="p-4">
            <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-sm">
              Completed
            </span>
          </td>

          <td class="p-4 flex gap-3">

            <a
              href="#"
              hx-target="#main"
              hx-swap="innerHTML"
              hx-get="/reports/1"
              class="text-blue-400 hover:text-blue-300"
            >
              View
            </a>

            <a
              href="#"
              hx-target="#main"
              hx-swap="innerHTML"
              hx-get="/reports/1/edit"
              class="text-yellow-400 hover:text-yellow-300"
            >
              Edit
            </a>

            <button
              class="text-red-400 hover:text-red-300"
            >
              Delete
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
{% endblock %}
