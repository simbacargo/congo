{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-6">

  <h1 class="text-2xl font-bold mb-6">
    Edit Subscription Plan
  </h1>

  <form class="space-y-5">

    <input
      type="text"
      value="Pro Plan"
      class="w-full border rounded-lg p-3"
    >

    <input
      type="number"
      value="29"
      class="w-full border rounded-lg p-3"
    >

    <input
      type="number"
      value="100"
      class="w-full border rounded-lg p-3"
    >

    <textarea
      rows="4"
      class="w-full border rounded-lg p-3"
    >Unlimited products, analytics, support</textarea>

    <select class="w-full border rounded-lg p-3">
      <option selected>Monthly</option>
      <option>Yearly</option>
    </select>

    <button class="bg-yellow-500 text-white px-6 py-3 rounded-lg">
      Update Plan
    </button>

  </form>

</div>
{% endblock %}
