<div class="min-h-screen bg-gray-100 p-6 text-gray-900">

<div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow space-y-6">

  <!-- Header -->
  <div>
    <h1 class="text-2xl font-bold">Add New Expense</h1>
    <p class="text-gray-500 text-sm">Fill out the details below to record a new expense.</p>
  </div>

  <!-- Expense Form -->
  <form class="space-y-4">

    <!-- Date -->
    <div>
      <label class="block text-sm font-medium mb-1" for="expense-date">Date</label>
      <input type="date" id="expense-date" class="w-full p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-500 outline-none">
    </div>

    <!-- Category -->
    <div>
      <label class="block text-sm font-medium mb-1" for="expense-category">Category</label>
      <select id="expense-category" class="w-full p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-500 outline-none">
        <option value="">Select a category</option>
        <option value="office">Office</option>
        <option value="travel">Travel</option>
        <option value="subscriptions">Subscriptions</option>
        <option value="utilities">Utilities</option>
        <option value="misc">Miscellaneous</option>
      </select>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium mb-1" for="expense-description">Description</label>
      <textarea id="expense-description" rows="3" class="w-full p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-500 outline-none" placeholder="e.g., Uber ride to client meeting"></textarea>
    </div>

    <!-- Amount -->
    <div>
      <label class="block text-sm font-medium mb-1" for="expense-amount">Amount</label>
      <input type="number" id="expense-amount" min="0" step="0.01" class="w-full p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-500 outline-none" placeholder="e.g., 45.00">
    </div>

    <!-- Receipt Upload -->
    <div>
      <label class="block text-sm font-medium mb-1" for="expense-receipt">Receipt (optional)</label>
      <input type="file" id="expense-receipt" class="w-full text-sm">
      <p class="text-gray-400 text-xs mt-1">JPG, PNG, or PDF up to 5MB</p>
    </div>

    <!-- Submit Button -->
    <div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg transition">
        Add Expense
      </button>
    </div>

  </form>

</div>
