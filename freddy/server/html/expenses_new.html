
{% block content %}
<div class="space-y-6">

  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold">Expenses</h1>

    <button class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
      Add Expense
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-gray-500">Monthly Expenses</p>
      <h2 class="text-3xl font-bold mt-2">$4,300</h2>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-gray-500">Utilities</p>
      <h2 class="text-3xl font-bold mt-2">$900</h2>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <p class="text-gray-500">Supplies</p>
      <h2 class="text-3xl font-bold mt-2">$1,200</h2>
    </div>

  </div>

  <div class="bg-white p-6 rounded-xl shadow">
    <canvas id="expenseChart"></canvas>
  </div>

</div>

<script>
new Chart(document.getElementById("expenseChart"), {
  type: 'line',
  data: {
    labels: ['Jan','Feb','Mar','Apr','May'],
    datasets: [{
      label: 'Expenses',
      data: [1200,900,1400,1000,1700],
      borderColor: '#ef4444',
      tension: 0.4
    }]
  }
});
</script>
{% endblock %}
