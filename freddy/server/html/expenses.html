<body class="min-h-screen p-6" style="background-color: #020d18; color: #fff;">

<div class="max-w-5xl mx-auto">

  <!-- Expenses Table -->
  <div class="bg-gray-900 p-6 rounded-xl shadow space-y-4">

    <h1 class="text-2xl font-bold mb-2">Expenses</h1>

    <!-- Filter/Search -->
    <input id="search-input" type="text" placeholder="Search description or category..."
      class="w-full p-2 rounded-lg bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring focus:ring-blue-500 mb-4">

    <table id="expenses-table" class="min-w-full border border-gray-700">
      <thead class="bg-gray-800 cursor-pointer">
        <tr>
          <th class="py-2 px-4 border-b border-gray-700" data-sort="date">Date</th>
          <th class="py-2 px-4 border-b border-gray-700" data-sort="description">Description</th>
          <th class="py-2 px-4 border-b border-gray-700" data-sort="category">Category</th>
          <th class="py-2 px-4 border-b border-gray-700" data-sort="amount">Amount</th>
          <th class="py-2 px-4 border-b border-gray-700">Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be dynamically generated -->
      </tbody>
    </table>

  </div>

</div>

<!-- Delete Confirmation Modal -->
<div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
  <div class="bg-gray-900 rounded-xl p-6 w-96 shadow-lg space-y-4 text-white">
    <h2 class="text-xl font-bold text-red-600">Are you sure?</h2>
    <p class="text-gray-300">Do you really want to delete this expense? This action cannot be undone.</p>
    <div class="flex justify-end space-x-2">
      <button id="cancel-btn" class="px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Cancel</button>
      <button id="confirm-delete-btn" class="px-4 py-2 bg-red-600 rounded hover:bg-red-500">Delete</button>
    </div>
  </div>
</div>

<script>
const expensesData = [
  { id: 1, date: '2026-04-25', description: 'Uber to client meeting', category: 'Travel', amount: 45.00 },
  { id: 2, date: '2026-04-24', description: 'Office supplies', category: 'Office', amount: 120.00 },
  { id: 3, date: '2026-04-20', description: 'Lunch with client', category: 'Food', amount: 60.00 },
];

const tbody = document.querySelector('#expenses-table tbody');

function renderTable(data) {
  tbody.innerHTML = '';
  data.forEach(expense => {
    const tr = document.createElement('tr');
    tr.dataset.id = expense.id;
    tr.innerHTML = `
      <td class="py-2 px-4">${expense.date}</td>
      <td class="py-2 px-4">${expense.description}</td>
      <td class="py-2 px-4">${expense.category}</td>
      <td class="py-2 px-4">$${expense.amount.toFixed(2)}</td>
      <td class="py-2 px-4 space-x-2">
        <button class="edit-btn bg-green-500 hover:bg-green-400 text-white px-3 py-1 rounded">Edit</button>
        <button class="delete-btn bg-red-500 hover:bg-red-400 text-white px-3 py-1 rounded">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  attachRowListeners();
}

function attachRowListeners() {
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = e => {
      const rowId = e.target.closest('tr').dataset.id;
      window.location.href = `/expenses/edit/${rowId}`;
    }
  });

  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.onclick = e => {
      rowToDelete = e.target.closest('tr');
      deleteModal.classList.remove('hidden');
    }
  });
}

// Delete Modal Logic
const deleteModal = document.getElementById('delete-modal');
const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
const cancelBtn = document.getElementById('cancel-btn');
let rowToDelete = null;

cancelBtn.onclick = () => {
  rowToDelete = null;
  deleteModal.classList.add('hidden');
};

confirmDeleteBtn.onclick = () => {
  if(rowToDelete) {
    const id = parseInt(rowToDelete.dataset.id);
    const index = expensesData.findIndex(e => e.id === id);
    if(index > -1) expensesData.splice(index, 1);
    renderTable(expensesData);
    rowToDelete = null;
    deleteModal.classList.add('hidden');
  }
};

// Sorting
let sortOrder = {};
document.querySelectorAll('th[data-sort]').forEach(header => {
  header.onclick = () => {
    const type = header.dataset.sort;
    let order = sortOrder[type] === 'asc' ? 'desc' : 'asc';
    sortOrder[type] = order;

    const sortedData = [...expensesData].sort((a,b) => {
      let valA = a[type];
      let valB = b[type];

      if(type === 'amount') {
        valA = parseFloat(valA);
        valB = parseFloat(valB);
      } else if(type === 'date') {
        valA = new Date(valA);
        valB = new Date(valB);
      } else {
        valA = valA.toLowerCase();
        valB = valB.toLowerCase();
      }

      if(order === 'asc') return valA > valB ? 1 : -1;
      else return valA < valB ? 1 : -1;
    });

    renderTable(sortedData);
  }
});

// Filtering
const searchInput = document.getElementById('search-input');
searchInput.oninput = () => {
  const filter = searchInput.value.toLowerCase();
  const filtered = expensesData.filter(e =>
    e.description.toLowerCase().includes(filter) ||
    e.category.toLowerCase().includes(filter)
  );
  renderTable(filtered);
};

// Initial render
renderTable(expensesData);
</script>
</body>
